<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="homebase architecture: record through bring-your-own capture adapters into a session, then two analysis pipelines producing a bug digest or a PRD and handoff">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7b"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ecf8e"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="640" rx="18" fill="#0f1720"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="none" stroke="#233240" stroke-width="1"/>

  <!-- wordmark + tagline -->
  <text x="48" y="72" fill="#ffffff" font-size="40" font-weight="700" letter-spacing="-0.5">homebase</text>
  <text x="49" y="104" fill="#3ecf8e" font-size="18" font-weight="600">Record your work once. Get the docs for free.</text>
  <line x1="48" y1="128" x2="1152" y2="128" stroke="#1c2836" stroke-width="1"/>

  <!-- STAGE 1: record -->
  <g>
    <rect x="48" y="250" width="180" height="120" rx="12" fill="#16212c" stroke="#2b3b4a" stroke-width="1.5"/>
    <text x="138" y="298" fill="#e6edf3" font-size="18" font-weight="700" text-anchor="middle">Record</text>
    <text x="138" y="324" fill="#8b98a5" font-size="13" text-anchor="middle">your screen</text>
    <text x="138" y="342" fill="#8b98a5" font-size="13" text-anchor="middle">+ your voice</text>
  </g>

  <!-- STAGE 2: bring-your-own capture layer -->
  <g>
    <rect x="288" y="212" width="266" height="196" rx="12" fill="#16212c" stroke="#2b3b4a" stroke-width="1.5"/>
    <text x="421" y="244" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">Bring-your-own capture</text>
    <text x="421" y="264" fill="#5b6b7b" font-size="11.5" text-anchor="middle" letter-spacing="0.5">PLUGGABLE ADAPTERS</text>
    <!-- recorder chip -->
    <rect x="308" y="284" width="226" height="52" rx="9" fill="#0f1a24" stroke="#33475a" stroke-width="1"/>
    <text x="320" y="305" fill="#9fb0bf" font-size="11.5" font-weight="600">RECORDER</text>
    <text x="320" y="324" fill="#cdd8e1" font-size="13">Screen Studio · file (BYO mp4)</text>
    <!-- dictation chip -->
    <rect x="308" y="344" width="226" height="52" rx="9" fill="#0f1a24" stroke="#33475a" stroke-width="1"/>
    <text x="320" y="365" fill="#9fb0bf" font-size="11.5" font-weight="600">DICTATION</text>
    <text x="320" y="384" fill="#cdd8e1" font-size="13">Vowen · WisprFlow · file (BYO)</text>
  </g>

  <!-- STAGE 3: session -->
  <g>
    <rect x="614" y="250" width="164" height="120" rx="12" fill="#16212c" stroke="#2b3b4a" stroke-width="1.5"/>
    <text x="696" y="296" fill="#e6edf3" font-size="18" font-weight="700" text-anchor="middle">Session</text>
    <text x="696" y="322" fill="#8b98a5" font-size="12.5" text-anchor="middle">raw.mp4</text>
    <text x="696" y="340" fill="#8b98a5" font-size="12.5" text-anchor="middle">+ transcript.json</text>
  </g>

  <!-- STAGE 4: two pipelines -->
  <!-- Pipeline A -->
  <g>
    <rect x="856" y="150" width="300" height="120" rx="12" fill="#12241d" stroke="#3ecf8e" stroke-width="1.5"/>
    <text x="876" y="182" fill="#3ecf8e" font-size="15" font-weight="700">Pipeline A · Bug digest</text>
    <text x="876" y="206" fill="#b7c6cf" font-size="12.5">What's broken / what was asked.</text>
    <text x="876" y="228" fill="#8b98a5" font-size="12">Zoned triage via context_config.</text>
    <text x="876" y="250" fill="#cdd8e1" font-size="12.5">→ PRD · DIGEST · bug cards · brief</text>
  </g>
  <!-- Pipeline B -->
  <g>
    <rect x="856" y="350" width="300" height="120" rx="12" fill="#1b1830" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="876" y="382" fill="#a78bfa" font-size="15" font-weight="700">Pipeline B · PRD + handoff</text>
    <text x="876" y="406" fill="#b7c6cf" font-size="12.5">What workflow did I just do.</text>
    <text x="876" y="428" fill="#8b98a5" font-size="12">LangGraph: classify→extract→generate.</text>
    <text x="876" y="450" fill="#cdd8e1" font-size="12.5">→ PRD · Claude Code handoff · pattern</text>
  </g>

  <!-- connectors -->
  <line x1="228" y1="310" x2="284" y2="310" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="554" y1="310" x2="610" y2="310" stroke="#5b6b7b" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- session splits to A and B -->
  <path d="M778 300 H812 V210 H852" fill="none" stroke="#3ecf8e" stroke-width="2" marker-end="url(#arrowA)"/>
  <path d="M778 320 H812 V410 H852" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- footer -->
  <text x="48" y="596" fill="#5b6b7b" font-size="12.5">One shared capture layer → two independent pipelines. Run either, or both, over the same recording.</text>
</svg>
